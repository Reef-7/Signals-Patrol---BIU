[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dts-simulation"
version = "0.1.0"
description = "Initial scaffold for a MUSIC-oriented acoustic localization simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "matplotlib>=3.8", "Pillow>=10.0"]

[project.scripts]
dts-simulation = "dts_simulation.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]
